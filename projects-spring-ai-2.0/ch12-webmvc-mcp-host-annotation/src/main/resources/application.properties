## 프로젝트 이름
spring.application.name=ch12-webmvc-mcp-host-annotation

## 서버 포트
server.port=8080

## 터미널 칼라 출력
spring.output.ansi.enabled=ALWAYS

## 로깅
logging.pattern.console=%clr(%-5level){green} %clr(%logger.%M\\(\\)){cyan}: %msg%n
# MCP Server가 반한하는 JSON 로깅
# logging.level.io.modelcontextprotocol=DEBUG
# LLM이 어떤 도구를 호출 요청했는지 로깅
# logging.level.org.springframework.ai=DEBUG

## 파일 업로드
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

## 정적 리소스에 대해 캐시 사용 안 함
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

## OpenAI 구성
spring.ai.openai.api-key=${OPENAI_API_KEY}

## MCP Client 구성
spring.ai.mcp.client.name=ch12-webmvc-mcp-host-annotation
spring.ai.mcp.client.version=0.0.1-SNAPSHOT
# MCP Server 연결 구성
# - 에러 표시를 없애는 방법: 
#   Windows/Preferences/Spring/Validation/Property Config Files
#   Invalid bean property: Ignore로 설정
spring.ai.mcp.client.streamable-http.connections.tool-server.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.tool-server.endpoint=/mcp
# MCP Client API 동기/비동기식 구성
spring.ai.mcp.client.type=SYNC

