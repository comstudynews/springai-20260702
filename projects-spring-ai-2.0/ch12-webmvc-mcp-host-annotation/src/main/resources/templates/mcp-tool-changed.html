<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP 도구 목록</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="/css/springai.css" rel="stylesheet" />
  <script src="/js/springai.js"></script>
  <style>
    .workspace,
    .workspace-column,
    .scroll-panel {
      min-height: 0;
    }

    .scroll-panel {
      overflow-y: auto;
      overflow-x: hidden;
    }

    @media (max-width: 991.98px) {
      .workspace {
        overflow: auto !important;
      }

      .workspace-column {
        min-height: 70vh;
      }
    }
  </style>
  <script>
    async function loadTools() {
      const spinner = document.getElementById("spinner");
      const message = document.getElementById("message");
      const toolList = document.getElementById("toolList");

      spinner.classList.remove("d-none");
      message.className = "text-secondary";
      message.textContent = "도구 목록을 불러오고 있습니다.";
      toolList.replaceChildren();

      try {
        const response = await fetch("/mcp-tool-changed/list-tools", { headers: { "Accept": "application/json" } });
        if (!response.ok) {
          throw new Error(`도구 목록 요청 실패 (${response.status})`);
        }

        const toolsByServer = await response.json();
        const entries = Object.entries(toolsByServer);
        const toolCount = entries.reduce((count, [, tools]) => count + tools.length, 0);

        message.className = "text-secondary";
        message.textContent = `${entries.length}개 서버에서 ${toolCount}개의 도구를 조회했습니다.`;

        if (toolCount === 0) {
          message.textContent = "현재 MCP Server가 제공하는 도구가 없습니다.";
          return;
        }

        entries.forEach(([serverName, tools]) => {
          const section = document.createElement("section");
          section.className = "mb-4";

          const heading = document.createElement("h2");
          heading.className = "h5 border-bottom pb-2 mb-3";
          heading.textContent = `${serverName} (${tools.length})`;
          section.appendChild(heading);

          const table = document.createElement("table");
          table.className = "table table-striped table-hover align-middle";
          table.innerHTML = `
            <thead>
              <tr>
                <th scope="col" style="width: 22%">도구 이름</th>
                <th scope="col" style="width: 38%">설명</th>
                <th scope="col">입력 스키마</th>
              </tr>
            </thead>
            <tbody></tbody>
          `;

          const tbody = table.querySelector("tbody");
          tools.forEach(tool => {
            const row = document.createElement("tr");
            const nameCell = document.createElement("td");
            const descriptionCell = document.createElement("td");
            const schemaCell = document.createElement("td");
            const schema = document.createElement("pre");

            nameCell.className = "fw-semibold text-break";
            nameCell.textContent = tool.name;
            descriptionCell.textContent = tool.description || "-";
            schema.className = "small bg-body-tertiary border p-2 mb-0 text-wrap";
            schema.textContent = JSON.stringify(tool.inputSchema, null, 2);
            schemaCell.appendChild(schema);
            row.append(nameCell, descriptionCell, schemaCell);
            tbody.appendChild(row);
          });

          const tableWrapper = document.createElement("div");
          tableWrapper.className = "table-responsive";
          tableWrapper.appendChild(table);
          section.appendChild(tableWrapper);
          toolList.appendChild(section);
        });
      } catch (error) {
        message.className = "text-danger";
        message.textContent = error.message;
      } finally {
        spinner.classList.add("d-none");
      }
    }

    async function updateTool(url) {
      const spinner = document.getElementById("spinner");
      const buttons = document.querySelectorAll("[data-tool-action]");

      spinner.classList.remove("d-none");
      buttons.forEach(button => button.disabled = true);

      try {
        await fetch(url, { method: "GET", mode: "no-cors" });
        window.location.reload();
      } catch (error) {
        const message = document.getElementById("message");
        message.className = "text-danger";
        message.textContent = error.message;
        spinner.classList.add("d-none");
        buttons.forEach(button => button.disabled = false);
      }
    }

    function setDynamicQuestion(question) {
      const questionElement = document.getElementById("dynamicQuestion");
      questionElement.value = question;
      questionElement.focus();
    }

    async function handleDynamicSubmit() {
      const questionElement = document.getElementById("dynamicQuestion");
      const submitButton = document.getElementById("dynamicSubmitButton");
      const question = questionElement.value.trim();
      if (question === "" || submitButton.disabled) return;

      submitButton.disabled = true;
      springai.addUserQuestion(question, "dynamicChatPanel");
      springai.setSpinner("dynamicSpinner", true);

      try {
        const response = await fetch("/mcp-tool-changed/chat", {
          method: "post",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "Accept": "text/plain"
          },
          body: new URLSearchParams({ question })
        });

        if (!response.ok) {
          throw new Error(`동적 도구 테스트 요청 실패 (${response.status})`);
        }

        const answerId = springai.addAnswerPlaceHolder("dynamicChatPanel");
        await springai.printAnswerText(response.body, answerId, "dynamicChatPanel");
      } catch (error) {
        const answerId = springai.addAnswerPlaceHolder("dynamicChatPanel");
        document.getElementById(answerId).textContent = error.message;
      } finally {
        springai.setSpinner("dynamicSpinner", false);
        submitButton.disabled = false;
      }
    }

    window.addEventListener("DOMContentLoaded", loadTools);
  </script>
</head>

<body>
  <div class="d-flex flex-column vh-100">
    <div id="headPanel" class="navbar justify-content-between border-bottom">
      <a href="/" class="navbar-brand ps-2">
        <img src="/image/spring_ai_logo_with_text.svg" width="200" alt="Spring AI" />
      </a>
      <div class="d-flex align-items-center gap-3 me-3">
        <div id="spinner" class="spinner-border spinner-border-sm text-success d-none" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    </div>

    <div class="workspace row g-0 flex-grow-1 overflow-hidden">
      <section class="workspace-column col-12 col-lg-7 d-flex flex-column h-100 border-end">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 border-bottom px-3 py-3">
          <div>
            <h1 class="h4 mb-1">MCP 도구 목록</h1>
            <p id="message" class="text-secondary mb-0"></p>
          </div>
          <div class="btn-group" role="group" aria-label="MCP 도구 관리">
            <button type="button" class="btn btn-success btn-sm" data-tool-action
                onclick="updateTool('/mcp-tool-changed/add-tool')">
              도구 추가
            </button>
            <button type="button" class="btn btn-outline-danger btn-sm" data-tool-action
                onclick="updateTool('/mcp-tool-changed/remove-tool')">
              도구 제거
            </button>
          </div>
        </div>
        <div id="toolList" class="scroll-panel flex-grow-1 px-3 py-3"></div>
      </section>

      <section class="workspace-column col-12 col-lg-5 d-flex flex-column h-100">
        <div class="d-flex align-items-center justify-content-between bg-body-tertiary border-bottom px-3 py-3">
          <h2 class="h5 mb-0">동적 MCP 도구 테스트</h2>
          <div id="dynamicSpinner" class="spinner-border spinner-border-sm text-success d-none" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <div id="dynamicChatPanel" class="scroll-panel flex-grow-1 container-fluid my-2">
          <div class="d-flex justify-content-start border-bottom m-2">
            <table>
              <tr>
                <td><img src="/image/assistant.png" width="50" alt="Assistant" /></td>
                <td><span>동적으로 추가된 회원 정보 조회 도구를 테스트해 보세요.</span></td>
              </tr>
            </table>
          </div>
        </div>

        <div class="bg-secondary-subtle border-top">
          <div class="d-flex flex-wrap gap-2 px-2 pt-2" aria-label="동적 도구 질문 템플릿">
            <button type="button" class="btn btn-sm btn-outline-success"
              onclick="setDynamicQuestion('member1 회원 정보를 조회해줘.')">member1 조회</button>
            <button type="button" class="btn btn-sm btn-outline-success"
              onclick="setDynamicQuestion('member2 회원 정보를 조회해줘.')">member2 조회</button>
          </div>
          <div class="input-group p-2">
            <span class="input-group-text">질문</span>
            <input id="dynamicQuestion" type="text" class="form-control"
              value="member1 회원 정보를 조회해줘." />
            <button id="dynamicSubmitButton" type="button" class="btn btn-primary"
              onclick="handleDynamicSubmit()">제출</button>
          </div>
        </div>
      </section>
    </div>
  </div>
</body>

</html>
