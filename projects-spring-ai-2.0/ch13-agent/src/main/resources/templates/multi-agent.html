<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spring AI - Multi Agent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <!-- 마크다운을 HTML로 변환하는 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="/css/springai.css" rel="stylesheet" />
  <script src="/js/springai.js"></script>
  <script>
    // ##### 제출 버튼을 클릭했을 때 실행하는 함수 #####
    async function handleSubmit() {
      const userId = document.getElementById("userId").value;
      const questionElement = document.getElementById("question");
      const question = questionElement.value.trim();
      if (question === "") return;

      try {
        springai.addUserQuestion(question, "chatPanel");
        springai.setSpinner("spinner", true);

        const response = await fetch('/ai/multi-agent', {
          method: "post",
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'Accept': 'text/plain'
          },
          body: new URLSearchParams({ userId, question })
        });

        if (!response.ok) {
          throw new Error(`요청 처리 실패: ${response.status}`);
        }

        const uuid = springai.addAnswerPlaceHolder("chatPanel");
        springai.printAnswerText(response.body, uuid, "chatPanel");
      } catch (error) {
        console.error(error);
      } finally {
        springai.setSpinner("spinner", false);
      }
    }

    function setQuestion(question) {
      document.getElementById("question").value = question;
    }
  </script>
</head>

<body>
  <div class="d-flex flex-column vh-100">
    <div id="headPanel" class="navbar justify-content-between">
      <a href="/" class="navbar-brand ps-2">
        <img src="/image/spring_ai_logo_with_text.svg" width="200" alt="Spring AI" />
      </a>
      <div id="spinner" class="spinner-border text-success d-none me-3" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div id="chatPanel" class="flex-grow-1 container-fluid h-100 my-2" style="overflow-y:auto; overflow-x:hidden;">
      <div class="d-flex justify-content-start border-bottom m-2">
        <table>
          <tr>
            <td><img src="/image/assistant.png" width="50" alt="Assistant" /></td>
            <td><span>고객지원 문의를 입력해주세요.</span></td>
          </tr>
        </table>
      </div>
    </div>

    <div id="inputPanel" class="bg-secondary-subtle">
      <div class="p-2 border-bottom">
        <div class="mb-2">
          <label for="userId" class="form-label mb-1">샘플 질문:</label>
		  <button type="button" class="btn btn-outline-primary btn-sm me-1" onclick="setQuestion('나의 정보를 알려줘')">UserInfoAgent</button>
          <button type="button" class="btn btn-outline-primary btn-sm me-1" onclick="setQuestion('제품 전원은 켜지지만 앱에서 연결 오류가 발생해요')">TechSupportAgent</button>
          <button type="button" class="btn btn-outline-primary btn-sm me-1" onclick="setQuestion('주문한 상품의 배송 상태를 알려주세요')">OrderAgent</button>
          <button type="button" class="btn btn-outline-primary btn-sm me-1" onclick="setQuestion('상품이 불량입니다. 환불하고 싶어요')">RefundAgent</button>
          <button type="button" class="btn btn-outline-primary btn-sm me-1" onclick="setQuestion('회원 가입한 ID로 로그인이 되지 않아요')">AccountAgent</button>
          <button type="button" class="btn btn-outline-primary btn-sm" onclick="setQuestion('오프라인 매장이 어디에 있나요?')">GeneralAgent</button>
        </div>
      </div>
      <div class="d-flex align-items-center gap-2 p-2 border-bottom">
        <label for="userId" class="form-label mb-0 flex-shrink-0">사용자 ID</label>
        <select id="userId" class="form-select form-select-sm">
          <option value="user1">user1</option>
          <option value="user2">user2</option>
        </select>
      </div>
      <div class="input-group p-2">
        <span class="input-group-text">고객 문의</span>
        <textarea id="question" class="form-control">나의 정보를 알려줘</textarea>
        <span class="input-group-text">
          <button type="button" class="btn btn-primary" onclick="handleSubmit()">제출</button>
        </span>
      </div>
    </div>
  </div>
</body>

</html>
