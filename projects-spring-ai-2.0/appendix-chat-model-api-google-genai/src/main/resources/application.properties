## 프로젝트 이름
spring.application.name=appendix-chat-model-api-google-genai

## 서버 포트
server.port=8080

## 터미널 칼라 출력
spring.output.ansi.enabled=ALWAYS

## 로깅
logging.pattern.console=%clr(%-5level){green} %clr(%logger{36}.%M\\(\\)){cyan}: %msg%n

## 파일 업로드
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

## 정적 리소스에 대해 캐시 사용 안 함
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

## 모델 구성
spring.ai.google.genai.api-key=${GOOGLE_AI_STUDIO_KEY}
# Spring AI 2.0의 기본 모델이 gemini-2.5-flash 이지만, 새로운 사용자는 더이상 사용할 수 없음
spring.ai.google.genai.chat.model=gemini-3.6-flash

